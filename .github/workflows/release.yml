name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          registry-url: ${{ env.NPM_REGISTRY }}
          cache: npm
      - name: Pin npm for trusted publishing
        run: |
          npm install --global npm@11.5.1
          test "$(npm --version)" = 11.5.1
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Validate exact stable tag and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run check:release -- "$RELEASE_TAG"
      - name: Remove setup-node auth config before OIDC
        run: |
          rm -f .npmrc
          unset NODE_AUTH_TOKEN NPM_TOKEN
      - name: Refuse classic npm tokens
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: node scripts/check-oidc-auth.mjs
      - name: Build, typecheck, and test
        run: |
          npm run build
          npm run typecheck
          npm test
      - name: Confirm registry returns E404 only
        run: node scripts/assert-unpublished.mjs
      - name: Validate actual tarball identity, exports, dependencies, and files
        run: npm run verify:pack
      - name: Validate isolated consumer
        run: npm run consumer:smoke -- "$AIHU_PACK_PATH"
      - name: Publish with OIDC provenance
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: env -u NODE_AUTH_TOKEN -u NPM_TOKEN npm publish "$AIHU_PACK_PATH" --access public --provenance --registry "$NPM_REGISTRY"
